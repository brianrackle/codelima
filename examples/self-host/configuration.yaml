# Sanitized reusable configuration for developing CodeLima with CodeLima.
# Configurations are directory-independent. Select this configuration when
# creating a node in your local checkout directory.
id: 019d25e8-6b6f-73ad-aa54-499f76f03f55
slug: codelima
image: ghcr.io/superradcompany/debian-systemd:12
agent_profile_name: codex-cli
environments:
  - codex
bootstrap_commands:
  - /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  - echo 'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"' >> ~/.profile
  - eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
  - apt-get update && apt-get install -yq make build-essential bubblewrap curl
  - curl -fsSL https://install.microsandbox.dev | sh
vcpus: 2
memory_mib: 4096
disk_mib: 20480
