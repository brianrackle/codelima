<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CodeLima wordmark animation</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #0c1015;
        color: #d9e2ec;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 20rem;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 15% 0%, rgb(50 109 98 / 16%), transparent 34rem),
          #0c1015;
      }

      .site-header {
        display: flex;
        align-items: center;
        min-height: 4rem;
        padding: 0 1.25rem;
        border-bottom: 1px solid #202a35;
      }

      .codelima-wordmark {
        color: #91e6c0;
        text-decoration: none;
      }

      [data-codelima-logo] {
        display: inline-block;
        width: 8ch;
        overflow: hidden;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 1rem;
        font-variant-ligatures: none;
        font-weight: 700;
        line-height: 1;
        white-space: nowrap;
      }

      main {
        display: grid;
        min-height: calc(100vh - 4rem);
        place-items: center;
        padding: 2rem 1.25rem;
      }

      .demo {
        width: min(100%, 34rem);
        padding: clamp(1.5rem, 5vw, 3rem);
        border: 1px solid #263442;
        border-radius: 1rem;
        background: rgb(15 21 28 / 88%);
        box-shadow: 0 1.5rem 5rem rgb(0 0 0 / 24%);
      }

      .demo h1 {
        margin: 0 0 0.75rem;
        color: #f0f5f8;
        font-size: clamp(1.6rem, 5vw, 2.4rem);
        line-height: 1.1;
      }

      .demo p {
        max-width: 29rem;
        margin: 0 0 1.5rem;
        color: #9aabb9;
        line-height: 1.65;
      }

      .replay {
        padding: 0.65rem 0.9rem;
        border: 1px solid #395064;
        border-radius: 0.5rem;
        background: #16212b;
        color: #d9e2ec;
        font: inherit;
        cursor: pointer;
      }

      .replay:hover {
        border-color: #5c7b91;
        background: #1b2a36;
      }

      .replay:focus-visible {
        outline: 2px solid #91e6c0;
        outline-offset: 3px;
      }

      @media (prefers-reduced-motion: reduce) {
        .replay {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <!-- Copy this element, the [data-codelima-logo] CSS, and the script. -->
      <a class="codelima-wordmark" href="/" aria-label="CodeLima home">
        <span data-codelima-logo role="img" aria-label="CodeLima">CodeLima</span>
      </a>
    </header>

    <main>
      <section class="demo" aria-labelledby="demo-title">
        <h1 id="demo-title">A quiet little entrance.</h1>
        <p>
          The wordmark shuffles in place, then locks from left to right. It uses
          no dependencies and stops all animation work when the name settles.
        </p>
        <button class="replay" type="button" data-replay-logo>
          Replay animation
        </button>
      </section>
    </main>

    <script>
      (() => {
        "use strict";

        const TARGET = "CodeLima";
        const GLYPHS = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
        const SETTLE_INTERVAL_MS = 1000 / 3;
        const SPIN_INTERVAL_MS = SETTLE_INTERVAL_MS / 6;
        const ANIMATION_DURATION_MS = TARGET.length * SETTLE_INTERVAL_MS;
        const runningAnimations = new WeakMap();

        function logoAtElapsedTime(elapsedMs) {
          const settledCount = Math.min(
            TARGET.length,
            Math.floor(elapsedMs / SETTLE_INTERVAL_MS),
          );
          const frame = Math.floor(elapsedMs / SPIN_INTERVAL_MS);
          let text = TARGET.slice(0, settledCount);

          for (let index = settledCount; index < TARGET.length; index += 1) {
            const rate = (index % 3) + 1;
            let glyphIndex = (frame * rate + index * 11) % GLYPHS.length;

            // An unlocked position never looks settled before its turn.
            if (GLYPHS[glyphIndex] === TARGET[index]) {
              glyphIndex = (glyphIndex + 1) % GLYPHS.length;
            }

            text += GLYPHS[glyphIndex];
          }

          return text;
        }

        function animateCodeLimaLogo(element) {
          if (!(element instanceof Element)) {
            throw new TypeError("animateCodeLimaLogo expects a DOM element");
          }

          const previousAnimation = runningAnimations.get(element);
          if (previousAnimation) {
            previousAnimation();
          }

          const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
          let animationFrameID = 0;
          let stopped = false;

          const stop = () => {
            if (stopped) {
              return;
            }

            stopped = true;
            window.cancelAnimationFrame(animationFrameID);
            reducedMotion.removeEventListener("change", handleMotionPreference);
            if (runningAnimations.get(element) === stop) {
              runningAnimations.delete(element);
            }
          };

          const finish = () => {
            element.textContent = TARGET;
            stop();
          };

          const handleMotionPreference = (event) => {
            if (event.matches) {
              finish();
            }
          };

          element.textContent = TARGET;
          if (reducedMotion.matches) {
            return stop;
          }

          runningAnimations.set(element, stop);
          reducedMotion.addEventListener("change", handleMotionPreference);

          const startedAt = performance.now();
          let lastFrame = -1;

          const tick = (now) => {
            if (stopped) {
              return;
            }

            const elapsedMs = Math.max(0, now - startedAt);
            const frame = Math.floor(elapsedMs / SPIN_INTERVAL_MS);

            if (frame !== lastFrame) {
              element.textContent = logoAtElapsedTime(elapsedMs);
              lastFrame = frame;
            }

            if (elapsedMs < ANIMATION_DURATION_MS) {
              animationFrameID = window.requestAnimationFrame(tick);
              return;
            }

            finish();
          };

          tick(startedAt);
          return stop;
        }

        window.animateCodeLimaLogo = animateCodeLimaLogo;

        const logos = document.querySelectorAll("[data-codelima-logo]");
        logos.forEach(animateCodeLimaLogo);

        document.querySelector("[data-replay-logo]")?.addEventListener("click", () => {
          logos.forEach(animateCodeLimaLogo);
        });
      })();
    </script>
  </body>
</html>
