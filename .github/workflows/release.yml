name: release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v1.2.3"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: meta
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          make --silent release-metadata >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-amd64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-14
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ needs.metadata.outputs.tag }}
      - name: Verify release candidate
        run: make verify test-race test-integration test-package
      - name: Build release archive
        env:
          PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          mkdir -p ./tmp/release/dist
          make package \
            DIST_DIR="$GITHUB_WORKSPACE/tmp/release/dist"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: ./tmp/release/dist/*
          if-no-files-found: error

  publish-release:
    needs:
      - metadata
      - build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ needs.metadata.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          path: ./tmp/release/dist
          pattern: release-*
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.metadata.outputs.tag }}
        shell: bash
        run: |
          notes=".github/release-notes/$TAG.md"
          test -s "$notes"
          gh release create "$TAG" ./tmp/release/dist/*.tar.gz ./tmp/release/dist/*.json \
            --repo "$GH_REPO" --title "$TAG" --generate-notes \
            --verify-tag --prerelease=false --latest=true --notes-file "$notes"

  update-homebrew-tap:
    needs:
      - metadata
      - build
      - publish-release
    if: ${{ vars.HOMEBREW_TAP_REPO != '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ needs.metadata.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          path: ./tmp/release/dist
          pattern: release-*
          merge-multiple: true
      - name: Render Homebrew formula
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          mkdir -p ./tmp/release/generated/Formula
          make package-formula \
            DIST_DIR="$GITHUB_WORKSPACE/tmp/release/dist" \
            FORMULA_OUTPUT="$GITHUB_WORKSPACE/tmp/release/generated/Formula/codelima.rb"
      - name: Update tap repository
        env:
          HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
          HOMEBREW_TAP_BRANCH: ${{ vars.HOMEBREW_TAP_BRANCH }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ needs.metadata.outputs.tag }}
        shell: bash
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "HOMEBREW_TAP_TOKEN is required to publish the Homebrew formula" >&2
            exit 1
          fi
          TAP_BRANCH="${HOMEBREW_TAP_BRANCH:-main}"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${HOMEBREW_TAP_REPO}.git" "$GITHUB_WORKSPACE/tmp/release/tap"
          cd "$GITHUB_WORKSPACE/tmp/release/tap"
          git checkout "$TAP_BRANCH"
          mkdir -p Formula
          cp "$GITHUB_WORKSPACE/tmp/release/generated/Formula/codelima.rb" "Formula/codelima.rb"
          git add "Formula/codelima.rb"
          git rm --ignore-unmatch -- "Formula/codelima-beta.rb"
          if git diff --cached --quiet; then
            echo "Homebrew formula already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update codelima to $TAG"
          git push origin "HEAD:${TAP_BRANCH}"
