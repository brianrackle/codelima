name: ci

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify
        run: make verify

  race:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Race detector
        run: make test-race

  # Integration tier (tests/, -tags=integration). Every test drives the built
  # codelima binary through daemon start/stop/update and node-host-shell
  # terminals, which are plain host shells - no Lima VM, no limactl, and no
  # network are required, so the whole tier is GitHub-runner safe. Linux only:
  # nothing in the tier is macOS-gated and the daemon paths under test are
  # platform independent.
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Integration tier
        run: make test-integration
